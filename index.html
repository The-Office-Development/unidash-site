<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UniDash</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
         color: #1a1a1a; background: #f6f5f0; }
  .card { text-align: center; padding: 40px 28px; }
  .logo { width: 64px; height: 64px; border-radius: 16px; background: #0E8A5F; color:#fff;
          display: grid; place-items: center; font-weight: 800; font-size: 1.4rem; margin: 0 auto 18px; }
  h1 { margin: 0 0 4px; letter-spacing: -0.5px; }
  p { color: #6b6b6b; margin: 0 0 24px; }
  a.link { display: block; max-width: 300px; margin: 10px auto; padding: 12px 18px; border-radius: 12px;
           border: 1px solid rgba(14,138,95,0.3); background: rgba(14,138,95,0.06);
           color: #0E8A5F; text-decoration: none; font-weight: 600; }
  @media (prefers-color-scheme: dark) { body { color:#e8e6e0; background:#14140f; } p { color:#9a988f; } }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">UD</div>
    <h1>UniDash</h1>
    <p>University cafeteria pre-ordering</p>
    <a class="link" href="privacy.html">Privacy Policy</a>
    <a class="link" href="delete-account.html">Delete your account</a>
  </div>
</body>
</html>
